[project]
name = "nattu"
version = "1.0.0"
description = "Enterprise RAG assistant with access control"
authors = [
    {name = "AWT"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bcrypt (>=5.0.0,<6.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "openai (>=3.49.0,<4.0.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "pgvector (>=0.5.1,<0.6.0)",
    "psycopg[binary] (>=3.3.8,<4.0.0)",
    "pymupdf (>=2.1,<3.0)",
    "pypdf (>=7.0.0,<8.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "sentence-transformers (>=6.2.0,<7.0.0)",
    "streamlit (>=1.67.0,<2.0.0)",
    "rapidocr (>=3.10.0,<4.0.0)",
    "fastapi (>=0.162.2,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "python-multipart (>=0.0.33,<0.0.34)"
]

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]